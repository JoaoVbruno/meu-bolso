# Gera o APK do Meu Bolso a cada push na main e publica em Releases.
# Link fixo para a versão mais nova:
#   https://github.com/JoaoVbruno/meu-bolso/releases/latest/download/meu-bolso.apk
name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Montar o projeto Android
        run: |
          npm run build:web
          npx cap add android
          node tools/make-icons.mjs --android
          npx cap sync android
          # Cada build ganha um número de versão maior, para instalar por cima da anterior.
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Compilar
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Assinar
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Falta o secret KEYSTORE_B64 (chave de assinatura)."; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > ks.p12
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ks.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --out meu-bolso.apk aligned.apk
          "$BT/apksigner" verify --print-certs meu-bolso.apk | head -3
          rm ks.p12

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" meu-bolso.apk \
            --title "Meu Bolso 1.0.${{ github.run_number }}" \
            --notes "Baixe meu-bolso.apk no celular Android e instale. Instala por cima da versão anterior sem perder dados."
