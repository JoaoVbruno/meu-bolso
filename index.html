<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Controle de contas mensais, consultor de compras e previsão.">
  <title>Meu Bolso</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">Meu Bolso</div>
    <div class="top-actions">
      <button id="btn-install" class="chip" hidden>Instalar</button>
      <button id="btn-settings" class="icon-btn" aria-label="Configurações">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.3 7.3 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.3 7.3 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.3 7.3 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.3 7.3 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Seções">
    <button data-tab="home"><span class="ti">◉</span>Início</button>
    <button data-tab="bills"><span class="ti">▤</span>Contas</button>
    <button data-tab="advisor"><span class="ti">?</span>Consultor</button>
    <button data-tab="plans"><span class="ti">★</span>Planos</button>
    <button data-tab="forecast"><span class="ti">↗</span>Previsão</button>
    <button data-tab="tx"><span class="ti">≡</span>Gastos</button>
  </nav>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <input type="file" id="file-import" accept=".csv,.ofx,text/csv,application/x-ofx" hidden>
  <input type="file" id="file-backup" accept=".json,application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
